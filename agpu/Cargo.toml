[package]
name = "aga"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["NERVOSYS <admin@nervosys.ai>"]
license = "AGPL-3.0-or-later"
description = "AgenticGraphicsAcceleration — standalone agentic-first GPU rendering backend; wgpu replacement with Vulkan, OpenGL, and complete ontology"
repository = "https://github.com/nervosys/DeweyGUI"
homepage = "https://github.com/nervosys/DeweyGUI/tree/master/agpu"
documentation = "https://docs.rs/aga"
readme = "README.md"
keywords = ["gpu", "wgpu", "rendering", "agent", "ontology"]
categories = ["rendering", "graphics", "gui"]

[lib]
name = "agpu"

[dependencies]
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
