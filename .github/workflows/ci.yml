name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # Accessibility is off by default and must not rot; it also pulls a
      # different egui feature set, which is where the version skew lives.
      - run: cargo test --features accesskit

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  benches:
    name: Benchmark crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `benches/comparative` and `benches/scaffold` are separate workspaces,
      # excluded from the package so their egui and iced dependencies are not
      # imposed on anyone installing the crate. That also means the main
      # `cargo check` never sees them, and both had silently stopped compiling
      # — one when node ids became `Cow<'static, str>`, the other when
      # `get_tree` gained `since`.
      # The sibling GPU crate has its own tests, doctests and reachability
      # checks, and the main `cargo test` does not reach them.
      - run: cargo test --manifest-path agpu/Cargo.toml
      - run: cargo check --all-targets --manifest-path benches/comparative/Cargo.toml
      - run: cargo check --all-targets --manifest-path benches/scaffold/Cargo.toml

      # Compiling a benchmark is not running one. These three assert something
      # before they time anything, and those assertions are what caught a
      # TodoMVC task that completed a todo which was never completed.
      #
      # Nothing here gates on wall-clock — the runner is far too noisy for
      # that. `allocs` gates on allocations and bytes per row, which do not
      # move with the machine; the other two gate on their own correctness
      # checks, and fail the job by panicking.
      - name: Allocation budgets
        run: cargo run --release --bin allocs --manifest-path benches/comparative/Cargo.toml
      - name: Agent loop closes
        run: cargo run --release --bin agent_loop --manifest-path benches/comparative/Cargo.toml
      - name: TodoMVC agent task completes
        run: cargo run --release --bin agent_task --manifest-path benches/scaffold/Cargo.toml
      # Prices asking the application against reading its source. Its
      # assertions are about the shape of the result, not its size: that a
      # targeted read stays far under a source file, that an unchanged poll
      # stays near free, and that on an application three times this toy's
      # size asking is ahead from the first observation.
      - name: Observation cost holds its shape
        run: cargo run --release --bin observation_cost --manifest-path benches/scaffold/Cargo.toml

      # The agentic harness scores a model's work. The scoring is what runs
      # here: reference solutions must come out at 1.000 and a deliberately
      # unaddressable one must not. Driving an actual model costs money and
      # lives in `run.py`, which CI never calls.
      - name: The agentic verifier scores what it claims to
        run: python benches/agentic/runner/selftest.py
